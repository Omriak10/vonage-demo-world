<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vonage solution explainer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0d0d;--muted:#6b6b76;--line:#e8e8ee}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.vlogo{display:block;padding:16px 20px 0}.vlogo img{height:22px;width:auto;display:block}
.wrap{max-width:640px;margin:0 auto;padding:16px 20px 40px}
.eyebrow{font:600 11px/1 Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font:700 24px/1.1 'Space Grotesk',sans-serif;margin:6px 0 12px}
.player{border:1.5px solid var(--ink);border-radius:16px;overflow:hidden;background:#000}.player video{width:100%;display:block;aspect-ratio:16/9}
.tag{color:var(--muted);margin:12px 0 16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:9px 14px;font:600 13px Inter;text-decoration:none;display:inline-flex;align-items:center;gap:8px}.btn.solid{background:var(--ink);color:#fff}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.more{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}.more h2{font:700 15px 'Space Grotesk',sans-serif;margin:0 0 8px}
.list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.list a{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:600 13px Inter;color:var(--ink);text-decoration:none}.list a.on{border-color:var(--ink);background:#f4f4f6}
</style></head><body>
<a class="vlogo" href="https://www.vonage.com" target="_blank" rel="noopener"><img src="https://rcs-designer-storage.s3.eu-north-1.amazonaws.com/demoworld/logo-black.svg" alt="Vonage"></a>
<div class="wrap"><div class="eyebrow">60-second explainer</div><h1 id="h">Vonage</h1>
<div class="player"><video id="v" controls playsinline autoplay muted></video></div>
<p class="tag" id="tag"></p>
<div class="btns"><a class="btn solid" id="docs" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Developer docs</a><a class="btn" id="mkt" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>Product page</a></div>
<div class="more"><h2>All explainers</h2><div class="list" id="list"></div></div></div>
<script>
const BASE='https://rcs-designer-storage.s3.eu-north-1.amazonaws.com/demoworld/peak/sol/';
const SOL=[["messages","Messages API","One API for RCS, WhatsApp, SMS, MMS and Viber","https://www.vonage.com/communications-apis/messages/","https://developer.vonage.com/en/messages/overview"],["rcs","RCS Business Messaging","Branded, verified, rich messaging in the default SMS app","https://www.vonage.com/communications-apis/messages/features/rcs/","https://developer.vonage.com/en/messages/concepts/rcs"],["whatsapp","WhatsApp Business","Conversations, templates and payments on WhatsApp","https://www.vonage.com/communications-apis/messages/features/whatsapp/","https://developer.vonage.com/en/messages/concepts/whatsapp"],["sms","SMS API","Global SMS with the reach of 1,600 networks","https://www.vonage.com/communications-apis/sms/","https://developer.vonage.com/en/messaging/sms/overview"],["viber","Viber Business Messages","Rich messages on Viber","https://www.vonage.com/communications-apis/messages/features/viber/","https://developer.vonage.com/en/messages/concepts/viber"],["verify","Verify API","One-time codes on SMS, WhatsApp, voice and email","https://www.vonage.com/communications-apis/verify/","https://developer.vonage.com/en/verify/overview"],["silent-auth","Silent Authentication","Verify a phone with no code at all","https://www.vonage.com/communications-apis/verify/","https://developer.vonage.com/en/verify/concepts/silent-authentication"],["voice","Voice API","Programmable calls, IVR, recording and AI voice","https://www.vonage.com/communications-apis/voice/","https://developer.vonage.com/en/voice/voice-api/overview"],["video","Video API","Live video in your app or site","https://www.vonage.com/communications-apis/video/","https://developer.vonage.com/en/video/overview"],["number-insight","Number Insight","Know the number before you message or call it","https://www.vonage.com/communications-apis/number-insight/","https://developer.vonage.com/en/number-insight/overview"],["network","Network APIs and Identity Insights","Real-time signals from the mobile network","https://www.vonage.com/communications-apis/","https://developer.vonage.com/en/identity-insights/overview"],["conversation","Conversation API","One conversation, every channel, full history","https://www.vonage.com/communications-apis/conversation/","https://developer.vonage.com/en/conversation/overview"],["ai-studio","AI Studio","Low-code conversational AI on voice and messaging","https://www.vonage.com/communications-apis/ai-studio/","https://developer.vonage.com/en/ai-studio/overview"],["fraud-defender","Fraud Defender","Stop SMS pumping and toll fraud before it bills you","https://www.vonage.com/communications-apis/fraud-defender/","https://developer.vonage.com/en/fraud-defender/overview"],["numbers","Phone Numbers","Virtual numbers in 100+ countries, provisioned by API","https://www.vonage.com/communications-apis/phone-numbers/","https://developer.vonage.com/en/numbers/overview"],["sip","SIP Trunking","Connect your PBX or contact centre to the world","https://www.vonage.com/communications-apis/sip-trunking/","https://developer.vonage.com/en/sip/overview"],["contact-center","Vonage Contact Center","An omnichannel contact centre inside your CRM","https://www.vonage.com/contact-centers/","https://developer.vonage.com/en/documentation"],["vbc","Vonage Business Communications","Calling, meetings and messaging for every team","https://www.vonage.com/unified-communications/","https://developer.vonage.com/en/vonage-business-cloud/overview"]];
const q=new URLSearchParams(location.search);let id=q.get('p')||'messages';
function show(i){const s=SOL.find(x=>x[0]===i)||SOL[0];id=s[0];document.getElementById('h').textContent=s[1];document.getElementById('tag').textContent=s[2];const v=document.getElementById('v');v.poster=BASE+s[0]+'-poster.jpg';v.src=BASE+s[0]+'.mp4';v.load();v.play().catch(()=>{});document.getElementById('docs').href=s[4];document.getElementById('mkt').href=s[3];
 document.getElementById('list').innerHTML=SOL.map(x=>'<a href="?p='+x[0]+'" class="'+(x[0]===id?'on':'')+'" data-i="'+x[0]+'">'+x[1]+'</a>').join('');document.querySelectorAll('#list a').forEach(a=>a.onclick=e=>{e.preventDefault();history.replaceState(null,'','?p='+a.dataset.i);show(a.dataset.i);window.scrollTo(0,0)});}
show(id);
</script></body></html>
