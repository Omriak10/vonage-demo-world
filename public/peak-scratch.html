<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scratch and win</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0d0d;--muted:#6b6b76;--line:#e8e8ee}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.vlogo{display:block;padding:16px 20px 0}.vlogo img{height:22px;width:auto;display:block}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 30px;text-align:center}
.eyebrow{font:600 11px/1 Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font:700 24px/1.1 'Space Grotesk',sans-serif;margin:6px 0 4px}p.l{color:var(--muted);margin:0 0 16px;font-size:14px}
.card{position:relative;width:100%;aspect-ratio:16/10;border:2px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;touch-action:none}
.prize{position:absolute;inset:0;display:grid;place-items:center;padding:20px}.prize b{font:700 26px/1.15 'Space Grotesk',sans-serif;display:block}.prize span{color:var(--muted);font-size:13.5px;display:block;margin-top:6px}
.prize svg{width:64px;height:64px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.hint{margin-top:12px;color:var(--muted);font-size:13px}
.btn{margin-top:14px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font:600 13.5px Inter;cursor:pointer;display:none}
</style></head><body>
<a class="vlogo" href="https://www.vonage.com" target="_blank" rel="noopener"><img src="https://rcs-designer-storage.s3.eu-north-1.amazonaws.com/demoworld/logo-black.svg" alt="Vonage"></a>
<div class="wrap"><div class="eyebrow">The RCS game</div><h1>Scratch and win</h1><p class="l">Rub the card with your finger. Everyone wins something today.</p>
<div class="card"><div class="prize" id="prize"></div><canvas id="c"></canvas></div>
<div class="hint" id="hint">Scratch to reveal</div><button class="btn" id="again" onclick="location.reload()">Scratch another</button>
<script>
const q=new URLSearchParams(location.search);const TO=q.get('to')||'',CH=q.get('ch')||'rcs';
const PRIZES=[['A Vonage hoodie','Collect it at the stand and show this screen','M20 12V22H4V12M22 7H2v5h20zM12 22V7M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7z'],['Coffee on Vonage','Any drink at the breakfast bar, on us','M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4zM6 1v3M10 1v3M14 1v3'],['A 30-minute RCS design session','Book it with the team before you leave','M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z'],['Front-row seat at the panel','Show this to the team at 11:30','M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z'],['A branded RCS demo for your company','Send us a photo in the chat and it is yours','M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z']];
const p=PRIZES[Math.floor(Math.random()*PRIZES.length)];
document.getElementById('prize').innerHTML='<div><svg viewBox="0 0 24 24"><path d="'+p[2]+'"/></svg><b>'+p[0]+'</b><span>'+p[1]+'</span></div>';
const c=document.getElementById('c'),ctx=c.getContext('2d');let done=false;
function size(){const r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 ctx.fillStyle='#0d0d0d';ctx.fillRect(0,0,r.width,r.height);ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;for(let x=-r.height;x<r.width;x+=16){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+r.height,r.height);ctx.stroke()}
 ctx.fillStyle='#fff';ctx.font='700 18px Space Grotesk, sans-serif';ctx.textAlign='center';ctx.fillText('SCRATCH HERE',r.width/2,r.height/2+6);ctx.globalCompositeOperation='destination-out'}
size();
let down=false;const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top]};
function rub(e){if(!down||done)return;const[x,y]=pos(e);ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();e.preventDefault();check()}
let n=0;function check(){if(++n%12)return;const r=c.getBoundingClientRect();const d=ctx.getImageData(0,0,c.width,c.height).data;let clear=0;for(let i=3;i<d.length;i+=4*7)if(d[i]===0)clear++;const pct=clear/(d.length/(4*7));if(pct>0.55){done=true;ctx.clearRect(0,0,r.width,r.height);document.getElementById('hint').textContent='You won: '+p[0]+'. Sent to your chat.';document.getElementById('again').style.display='inline-block';
 if(TO)fetch('/dw/peak/prize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:TO,ch:CH,prize:p[0],note:p[1]})}).catch(()=>{})}}
c.addEventListener('pointerdown',e=>{down=true;rub(e)});c.addEventListener('pointermove',rub);window.addEventListener('pointerup',()=>down=false);
c.addEventListener('touchstart',e=>{down=true;rub(e)},{passive:false});c.addEventListener('touchmove',rub,{passive:false});window.addEventListener('touchend',()=>down=false);
</script></div></body></html>
