<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Users · Demo-World Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#fafafb;color:#0a0a0a;min-height:100vh}
.nav{display:flex;align-items:center;gap:10px;padding:16px 26px;background:#fff;border-bottom:1px solid #ececf0}
.nav img{height:22px}
.nav b{font-family:'Space Grotesk';font-size:15px}
.nav a{margin-left:auto;color:#55515e;font-size:13px;font-weight:600;text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:30px 20px}
h1{font-family:'Space Grotesk';font-size:26px;letter-spacing:-.02em;margin-bottom:4px}
.sub{color:#6f6b7a;font-size:13.5px;margin-bottom:22px}
table{width:100%;background:#fff;border:1px solid #ececf0;border-radius:16px;border-collapse:separate;border-spacing:0;overflow:hidden}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8b8698;text-align:left;padding:12px 16px;border-bottom:1px solid #ececf0;background:#fcfcfd}
td{padding:13px 16px;font-size:13.5px;border-bottom:1px solid #f2f2f5;vertical-align:middle}
tr:last-child td{border-bottom:none}
td b{display:block}
td span{font-size:12px;color:#8b8698}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:100px}
.pill.v{background:#e8f7ee;color:#116b3d}
.pill.p{background:#fdf3e0;color:#9a6a12}
.del{border:1px solid #f1c9c7;background:#fff;color:#b3261e;font-family:inherit;font-weight:700;font-size:12px;padding:7px 14px;border-radius:100px;cursor:pointer}
.del:hover{background:#fdecec}
.del:disabled{opacity:.4;cursor:default}
.empty{padding:40px;text-align:center;color:#8b8698}
</style></head><body>
<div class="nav"><img src="https://rcs-designer-storage.s3.eu-north-1.amazonaws.com/demoworld/logo-black.svg?v=6" alt="Vonage"><b>Demo-World · Users</b><a href="/demoworld">← Back to Demo-World</a></div>
<div class="wrap">
  <h1>Registered users</h1>
  <div class="sub" id="count">Loading…</div>
  <table><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Registered</th><th>Last sign-in</th><th></th></tr></thead>
  <tbody id="tb"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody></table>
</div>
<script>
function fmt(d){if(!d)return '<span>never</span>';const t=new Date(d);return t.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
async function load(){
 const r=await fetch('/dw/api/users').then(x=>x.json()).catch(()=>({}));
 if(!r.users){document.getElementById('tb').innerHTML='<tr><td colspan="6" class="empty">Not authorised.</td></tr>';return;}
 document.getElementById('count').textContent=r.users.length+' user'+(r.users.length!==1?'s':'')+' · only you can see this page';
 document.getElementById('tb').innerHTML=r.users.map(u=>`<tr>
  <td><b>${u.name}</b><span>${u.email}</span></td>
  <td>${u.role||'-'}</td>
  <td><span class="pill ${u.verified?'v':'p'}">${u.verified?'Verified':'Pending'}</span></td>
  <td>${fmt(u.created)}</td>
  <td>${fmt(u.lastLogin)}</td>
  <td>${u.email==='__ADMIN_EMAIL__'?'':`<button class="del" onclick="del('${u.email}',this)">Delete</button>`}</td>
 </tr>`).join('')||'<tr><td colspan="6" class="empty">No users yet.</td></tr>';
}
async function del(email,btn){
 if(!confirm('Delete '+email+'? They will need to register again.'))return;
 btn.disabled=true;
 const r=await fetch('/dw/api/users/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}).then(x=>x.json());
 if(r.ok)load();else{alert(r.error||'Failed');btn.disabled=false;}
}
load();
</script>
</body></html>
